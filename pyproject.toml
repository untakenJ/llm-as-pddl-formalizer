[project]
name = "llm-as-pddl-formalizer"
version = "0.1.0"
description = "Pipelines for generating PDDL with language models"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-genai>=2.10.0,<3",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "networkx>=3.6.1,<4",
    "openai>=2.43.0,<3",
    "pandas>=3.0.3,<4",
    "python-dotenv>=1.2.2,<2",
    "requests>=2.34.2,<3",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
cpu = [
    "accelerate>=1.14.0,<2",
    "bitsandbytes>=0.49.2,<1",
    "kani[huggingface]>=1.9.1,<2",
    "torch>=2.11.0,<3",
    "transformers>=5.12.1,<6",
]
cuda = [
    "accelerate>=1.14.0,<2",
    "bitsandbytes>=0.49.2,<1",
    "kani[huggingface]>=1.9.1,<2",
    "torch>=2.11.0,<3",
    "transformers>=5.12.1,<6",
]

[tool.uv]
package = false
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
